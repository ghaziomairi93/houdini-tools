<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Minds PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans&family=Space+Mono&display=swap" rel="stylesheet">

<style>
body{margin:0;background:#07070f;color:#fff;font-family:'DM Sans'}
.container{max-width:420px;margin:auto;padding:12px}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border-radius:18px;padding:14px;margin-bottom:10px}
.title{font-family:'Syne';color:#00e5ff}
.clock{font-family:'Space Mono';font-size:32px;color:#00e060;text-align:center}
button{background:#00e5ff;border:none;padding:6px 10px;border-radius:10px}
input{width:100%;margin-top:5px;padding:8px;border-radius:10px;border:none;background:#111;color:#fff}
.green{color:#00ff88}
.red{color:#ff4d4d}
.small{font-size:12px;opacity:.7}
</style>
</head>

<body>
<div class="container">

<div class="card">
<div class="title">Big Minds</div>
<div id="greet"></div>
<button id="locBtn">Set Location</button>
</div>

<div class="card"><div id="clock" class="clock"></div></div>

<div class="card">
<div id="weather"></div>
<button id="unitBtn">Toggle</button>
</div>

<div class="card"><div id="quote"></div><button id="newQ">New</button></div>

<div class="card"><h3>Crypto</h3><div id="crypto"></div></div>

<div class="card"><h3>Forex</h3><div id="fx"></div></div>

<div class="card"><h3>News</h3><div id="news"></div></div>

<div class="card"><h3>Prayer</h3><div id="prayer"></div></div>

<div class="card">
<h3>Tasks</h3>
<input id="taskInput"><button id="addTask">+</button>
<div id="tasks"></div>
</div>

<div class="card">
<h3>Countdown</h3>
<input id="cdName"><input type="date" id="cdDate">
<button id="saveCd">Save</button>
<div id="cd"></div>
</div>

<div class="card">
<h3>Gmail</h3>
<button id="gLogin">Login</button>
<div id="gmail"></div>
</div>

<div class="card">
<h3>Outlook</h3>
<button id="mLogin">Login</button>
<div id="outlook"></div>
</div>

</div>

<script>
(function(){
'use strict';

/* UTIL */
function pad2(n){var s=String(Math.floor(n));return s.length<2?'0'+s:s}

/* CLOCK */
function clk(){
var d=new Date();
document.getElementById('clock').innerHTML=
pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
requestAnimationFrame(clk);
}
clk();

/* GREET */
function greet(){
var h=new Date().getHours(),g='Night';
if(h>5&&h<12)g='Morning';else if(h<17)g='Afternoon';else if(h<21)g='Evening';
document.getElementById('greet').innerHTML='Good '+g;
}
greet();

/* LOCATION */
function setLoc(){
navigator.geolocation.getCurrentPosition(function(p){
localStorage.setItem('bmd_loc',JSON.stringify({lat:p.coords.latitude,lon:p.coords.longitude}));
loadWeather();loadPrayer();
});
}

/* WEATHER */
var useC=true;
function loadWeather(){
var l=JSON.parse(localStorage.getItem('bmd_loc')||'null');
if(!l)return;
fetch('https://api.open-meteo.com/v1/forecast?latitude='+l.lat+'&longitude='+l.lon+'&current_weather=true')
.then(function(r){return r.json()})
.then(function(d){
var t=d.current_weather.temperature;
if(!useC)t=t*9/5+32;
document.getElementById('weather').innerHTML='Temp '+t.toFixed(1);
});
}

/* QUOTES */
var qs=["Dream big","Stay sharp","Focus","Build","Win","Learn","Execute","Push","Think","Grow","Lead","Create","Repeat","Discipline","Energy"];
function newQ(){
document.getElementById('quote').innerHTML=qs[Math.floor(Math.random()*qs.length)];
}
newQ();

/* TASKS */
function loadTasks(){
var t=JSON.parse(localStorage.getItem('bmd_tasks')||'[]'),el=document.getElementById('tasks');el.innerHTML='';
var i;for(i=0;i<t.length;i++){
var d=document.createElement('div');
d.innerHTML=t[i]+' <button data-i="'+i+'">x</button>';
el.appendChild(d);
}
}
function addTask(){
var v=document.getElementById('taskInput').value;if(!v)return;
var t=JSON.parse(localStorage.getItem('bmd_tasks')||'[]');
t.push(v);localStorage.setItem('bmd_tasks',JSON.stringify(t));
loadTasks();
}

/* COUNTDOWN */
function updCd(){
var c=JSON.parse(localStorage.getItem('bmd_cd')||'null');
if(!c)return;
var diff=new Date(c.date)-new Date();
if(diff<0){document.getElementById('cd').innerHTML='Done';return;}
var d=Math.floor(diff/86400000);
document.getElementById('cd').innerHTML=c.name+' '+d+'d';
}
function saveCd(){
localStorage.setItem('bmd_cd',JSON.stringify({name:cdName.value,date:cdDate.value}));
updCd();
}

/* CRYPTO */
function loadCrypto(){
fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,helium,binancecoin,official-trump&vs_currencies=usd')
.then(function(r){return r.json()})
.then(function(d){
localStorage.setItem('bmd_crypto',JSON.stringify(d));
renderCrypto(d);
})
.catch(function(){
renderCrypto(JSON.parse(localStorage.getItem('bmd_crypto')||'{}'));
});
}
function renderCrypto(d){
var el=document.getElementById('crypto');el.innerHTML='';
for(var k in d){
var div=document.createElement('div');
div.innerHTML=k+': $'+d[k].usd;
el.appendChild(div);
}
}

/* FOREX */
function loadFx(){
fetch('https://api.exchangerate.host/latest?base=USD')
.then(function(r){return r.json()})
.then(function(d){
localStorage.setItem('bmd_forex',JSON.stringify(d));
renderFx(d);
})
.catch(function(){
renderFx(JSON.parse(localStorage.getItem('bmd_forex')||'{}'));
});
}
function renderFx(d){
var el=document.getElementById('fx');el.innerHTML='';
if(!d.rates)return;
var pairs=['EUR','SAR','GBP','AED'],i;
for(i=0;i<pairs.length;i++){
var p=pairs[i];
var div=document.createElement('div');
div.innerHTML='USD/'+p+': '+d.rates[p];
el.appendChild(div);
}
}

/* NEWS */
function loadNews(){
var feeds=[
'https://api.rss2json.com/v1/api.json?rss_url=https://rss.nytimes.com/services/xml/rss/nyt/Automobiles.xml',
'https://api.rss2json.com/v1/api.json?rss_url=https://rss.nytimes.com/services/xml/rss/nyt/MiddleEast.xml',
'https://api.rss2json.com/v1/api.json?rss_url=https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml'
];
var i;
for(i=0;i<feeds.length;i++){
fetch(feeds[i])
.then(function(r){return r.json()})
.then(function(d){
renderNews(d.items.slice(0,3));
});
}
}
function renderNews(items){
var el=document.getElementById('news');
var i;for(i=0;i<items.length;i++){
var div=document.createElement('div');
div.innerHTML=items[i].title;
el.appendChild(div);
}
}

/* PRAYER */
function loadPrayer(){
var l=JSON.parse(localStorage.getItem('bmd_loc')||'null');
if(!l)return;
fetch('https://api.aladhan.com/v1/timings?latitude='+l.lat+'&longitude='+l.lon+'&method=2')
.then(function(r){return r.json()})
.then(function(d){
var t=d.data.timings;
document.getElementById('prayer').innerHTML=
'Fajr '+t.Fajr+'<br>Dhuhr '+t.Dhuhr+'<br>Asr '+t.Asr+'<br>Maghrib '+t.Maghrib;
});
}

/* GOOGLE LOGIN (simplified token) */
function gLogin(){
window.open('https://accounts.google.com/o/oauth2/v2/auth?client_id=623465337664-jf51sn11crs5bs398inc40al4ksjv1rd.apps.googleusercontent.com&redirect_uri='+encodeURIComponent(location.href)+'&response_type=token&scope=https://www.googleapis.com/auth/gmail.readonly','_blank');
}

/* MICROSOFT LOGIN */
function mLogin(){
window.open('https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=1155afdf-d585-48cc-af89-b973843ce21a&response_type=token&redirect_uri='+encodeURIComponent('https://ghaziomairi93.github.io/houdini-tools/')+'&scope=openid profile Mail.Read Calendars.Read','_blank');
}

/* EVENTS */
document.addEventListener('DOMContentLoaded',function(){
locBtn.addEventListener('click',setLoc);
unitBtn.addEventListener('click',function(){useC=!useC;loadWeather();});
addTask.addEventListener('click',addTask);
saveCd.addEventListener('click',saveCd);
newQ.addEventListener('click',newQ);
gLogin.addEventListener('click',gLogin);
mLogin.addEventListener('click',mLogin);

loadTasks();
updCd();
loadWeather();
loadCrypto();
loadFx();
loadNews();
loadPrayer();
});

})();
</script>

</body>
</html>
